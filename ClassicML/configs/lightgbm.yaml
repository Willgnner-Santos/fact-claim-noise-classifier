experiment_id: "lightgbm"
description: "LightGBM — faster than XGBoost, excellent on TF-IDF features"
model:
  name: "LGBMClassifier"
  family: "boosting"
  requires_proba: true
  params:
    n_estimators: 300
    max_depth: -1
    learning_rate: 0.1
    num_leaves: 63
    subsample: 0.8
    colsample_bytree: 0.8
    random_state: 42
    n_jobs: -1
    device: "cpu"               # change to "gpu" if available
    verbose: -1
