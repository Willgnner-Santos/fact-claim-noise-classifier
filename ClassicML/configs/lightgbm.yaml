experiment_id: "lightgbm"
description: "LightGBM — mais rápido que XGBoost, excelente em TF-IDF"
model:
  name: "LGBMClassifier"
  family: "boosting"
  requires_proba: true
  params:
    n_estimators: 300
    max_depth: -1
    learning_rate: 0.1
    num_leaves: 63
    subsample: 0.8
    colsample_bytree: 0.8
    random_state: 42
    n_jobs: -1
    device: "cpu"               # trocar para "gpu" se disponível
    verbose: -1
