# =============================================================================
# BASE configuration — ClassicML (Classical ML)
# =============================================================================
# Inherited by all model configs. Uses the same metrics spreadsheet as
# the Transformer pipeline (Métricas_Avaliação_Modelos.xlsx).
#
# Differences from the BERT pipeline:
# - Stratified K-Fold (scientific standard for classical models)
# - No GPU required — everything runs on CPU
# - TF-IDF vectorization (configurable)
# - No neural tokenization

project_name: "Fato_Tese_Ruido_ClassicML"

# Canonical labels (identical to the BERT pipeline)
labels:
  id2label: {0: "tese", 1: "fato", 2: "ruido"}
  num_labels: 3

seed: 42

# --- Data -------------------------------------------------------------------
data:
  # Uses splits already generated by the BERT pipeline (group_by_document=True)
  # for fair comparison. If they do not exist, generates from raw with the same split.
  use_bert_splits: true
  processed_dir: "../Models_BERT/data/processed"   # splits generated by the BERT pipeline
  raw_file: "../Models_BERT/Data/dataset_FINAL.json"
  text_column: "text"
  label_column: "label"

# --- K-Fold -----------------------------------------------------------------
# Scientific standard for classical models. K=5 is most widely cited.
# Uses StratifiedKFold to ensure per-class balance across folds.
cv:
  strategy: "stratified_kfold"   # stratified_kfold | leave_one_out | hold_out
  n_splits: 5
  shuffle: true
  random_state: 42
  # If true, also evaluates on the fixed hold-out test set (final hold-out)
  # for direct comparison with BERT models.
  final_test_eval: true

# --- TF-IDF Vectorization ---------------------------------------------------
# Feature extraction for all classical models.
vectorizer:
  type: "tfidf"                  # tfidf | count | hashing
  max_features: 50000
  ngram_range: [1, 2]            # unigrams + bigrams
  sublinear_tf: true
  min_df: 2
  strip_accents: null            # null = preserve accents (Portuguese legal texts)
  analyzer: "word"

# --- Metrics (all from the Métricas_Avaliação_Modelos.xlsx spreadsheet) -----
metrics:
  primary: "f1_macro"
  compute_probabilistic: true    # ROC-AUC, PR-AUC, Log Loss, Brier (require predict_proba)
  report_per_class: true
  report_confusion_matrix: true

# --- Visualizations ----------------------------------------------------------
viz:
  languages: ["pt", "en"]
  dpi: 150
  format: "png"
  save_figures: true

# --- Model (overridden in each config) --------------------------------------
model:
  name: null
  family: "classic"
  requires_proba: true           # if false, probabilistic metrics are not computed
  params: {}                     # hyperparameters passed to the sklearn constructor
