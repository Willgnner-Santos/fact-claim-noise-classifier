experiment_id: "naive_bayes"
description: "Multinomial Naive Bayes — classical probabilistic baseline for NLP"
model:
  name: "MultinomialNB"
  family: "probabilistic"
  requires_proba: true
  params:
    alpha: 0.1
vectorizer:
  sublinear_tf: false            # MNB requires non-negative values (no log scaling)
