experiment_id: "xgboost"
description: "XGBoost — state-of-the-art em dados esparsos/TF-IDF"
model:
  name: "XGBClassifier"
  family: "boosting"
  requires_proba: true
  params:
    n_estimators: 300
    max_depth: 6
    learning_rate: 0.1
    subsample: 0.8
    colsample_bytree: 0.8
    use_label_encoder: false
    eval_metric: "mlogloss"
    random_state: 42
    n_jobs: -1
    tree_method: "hist"         # rápido em CPU e GPU; usa GPU se disponível
    device: "cuda"              # auto-detecta GPU; cai para CPU se não houver
