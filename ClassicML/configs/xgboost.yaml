experiment_id: "xgboost"
description: "XGBoost — state-of-the-art on sparse/TF-IDF data"
model:
  name: "XGBClassifier"
  family: "boosting"
  requires_proba: true
  params:
    n_estimators: 300
    max_depth: 6
    learning_rate: 0.1
    subsample: 0.8
    colsample_bytree: 0.8
    use_label_encoder: false
    eval_metric: "mlogloss"
    random_state: 42
    n_jobs: -1
    tree_method: "hist"         # fast on both CPU and GPU; uses GPU if available
    device: "cuda"              # auto-detects GPU; falls back to CPU if unavailable
