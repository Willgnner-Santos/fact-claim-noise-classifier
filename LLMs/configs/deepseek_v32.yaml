# DeepSeek V3.2 — tier: top
_base: "_base_llm.yaml"

model:
  alias: "deepseek_v32"
  display_name: "DeepSeek V3.2"
  tier: "top"
  provider: "top"

experiment:
  # Expensive models (elite/top): test set only, 1 main strategy
  # Cheap models (light/good): all strategies on dev and test
  strategies: ["zero_shot", "few_shot", "evidence_constrained", "decomposed"]
  delay_between_calls: 0.5
