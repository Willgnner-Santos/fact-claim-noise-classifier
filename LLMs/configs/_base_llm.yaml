# =============================================================================
# BASE config — LLM experiments (inherited by all models)
# =============================================================================

seed: 42

data:
  raw_file: "E:/Anonymous/Fato_Tese_Ruido/Models_BERT/Data/dataset_FINAL.json"
  processed_file: "E:/Anonymous/Fato_Tese_Ruido/LLMs/data/splits"
  bedrock_registry: "E:/Anonymous/Fato_Tese_Ruido/LLMs/bedrock_modelos_refatorado.json"

split:
  test_size: 0.10
  val_size: 0.10
  stratify: true
  random_state: 42

anonymization:
  enabled: true
  entities: [cpf, cnpj, email, phone, cep, oab, money, url, processo]
  mask_names: false

preprocess:
  to_string: true
  strip: true
  lowercase: false
  normalize_whitespace: true
  strategy: "none"

experiment:
  # Primary evaluation split
  eval_split: "test"
  # Strategies to run (subset to reduce cost)
  strategies: ["zero_shot", "few_shot", "evidence_constrained", "decomposed"]
  # Temperature: 0 = deterministic
  temperature: 0.0
  max_tokens: 1024
  # Delay between calls (seconds) — respects rate limits
  delay_between_calls: 0.5
  # Smoke test before starting
  smoke_test: true
  # Concurrent calls per model (asyncio.Semaphore).
  # 5 is conservative and safe for all tested providers.
  # Reduce to 2-3 if ThrottlingException appears.
  # For small --sample-n, code automatically limits to min(concurrency, n//3).
  concurrency: 5

output:
  ckpt_dir: "E:/Anonymous/Fato_Tese_Ruido/LLMs/data/checkpoints"
  results_dir: "E:/Anonymous/Fato_Tese_Ruido/LLMs/data/results"
  reports_dir: "E:/Anonymous/Fato_Tese_Ruido/LLMs/data/reports"
  dpi: 150

# Fallback: model used if the primary fails after all retries
fallback_model_alias: "claude_3_haiku"
