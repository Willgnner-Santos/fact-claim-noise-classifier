# Mistral Large 3 — tier: top
_base: "_base_llm.yaml"

model:
  alias: "mistral_large_3"
  display_name: "Mistral Large 3"
  tier: "top"
  provider: "top"

experiment:
  # Modelos caros (elite/top): só no test set, 1 estratégia principal
  # Modelos baratos (leve/bom): todas as estratégias no dev e test
  strategies: ["zero_shot", "few_shot", "evidence_constrained", "decomposed"]
  delay_between_calls: 0.5
