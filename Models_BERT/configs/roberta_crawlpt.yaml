# Original: acc ~0.9925 (melhor dos originais). RoBERTa PT treinado em web crawl.
experiment_id: "roberta_crawlpt"
description: "RoBERTa PT (eduagarcia/RoBERTaCrawlPT-base) — reprodução fiel"

model:
  name: "eduagarcia/RoBERTaCrawlPT-base"
  family: "encoder"
  is_reproduction: true

train:
  # [MELHORIA — uso pleno de GPU] batch 32 -> 128, LR 2e-5 -> 4e-5 (raiz) + warmup.
  # Reprodução estrita: bs=32, lr=2e-5, warmup_ratio=0.0.
  per_device_train_batch_size: 128
  num_train_epochs: 10               # [FIEL]
  learning_rate: 4.0e-5
  warmup_ratio: 0.06
