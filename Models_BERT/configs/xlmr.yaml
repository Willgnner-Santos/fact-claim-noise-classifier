# =============================================================================
# XLM-RoBERTa base — MODELO NOVO (melhoria)
# =============================================================================
# Encoder multilingual robusto (FacebookAI/xlm-roberta-base, ~270M). Estava
# comentado no notebook training(1).ipynb. Justificativa: forte baseline
# cross-lingual, bom desempenho em PT, complementa o mBERT como referência
# multilingual mais moderna. Requer sentencepiece.
experiment_id: "xlmr"
description: "XLM-RoBERTa base (FacebookAI/xlm-roberta-base) — modelo novo"

model:
  name: "FacebookAI/xlm-roberta-base"
  family: "encoder"
  is_reproduction: false

train:
  # Modelo novo — batch generoso para uso pleno de GPU A100/H100.
  per_device_train_batch_size: 96
  num_train_epochs: 10
  learning_rate: 4.0e-5
  warmup_ratio: 0.06
