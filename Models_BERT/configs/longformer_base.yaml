# =============================================================================
# Longformer Base — long-context encoder (main architectural improvement)
# =============================================================================
# Directly addresses the long-text problem: the dataset median is ~799 words
# and p90 ~3,430, so most passages exceed the 512-token limit of standard encoders.
# Longformer processes up to 4096 tokens natively (sparse window attention +
# global attention), capturing the full document rather than only the beginning.
#
# Model: allenai/longformer-base-4096 (English pretraining, fine-tuned on PT corpus).
# Rationale: state-of-the-art long-document classification architecture;
# avoids information loss from 512-token truncation.
experiment_id: "longformer_base"
description: "Longformer base 4096 (allenai/longformer-base-4096) — long-context, pretrained on English, fine-tuned on PT"

model:
  name: "allenai/longformer-base-4096"
  family: "longformer"
  is_reproduction: false

tokenization:
  max_length: 4096                   # native long-context
  long_text_strategy: "truncate"     # covers almost the entire dataset within 4096

train:
  # Long-context (4096 tokens) on A100-40GB with bf16: bs=8 fits with gradient_checkpointing.
  # Without GC activations alone take ~25 GB; with GC this drops to ~12 GB.
  # NOTE: per_device_eval_batch_size MUST be explicit — without it the auto-calc
  # gives min(8x4, 128)=32 samples x 4096 tokens at validation, causing OOM even on A100.
  per_device_train_batch_size: 8
  gradient_accumulation_steps: 4     # effective batch = 32
  per_device_eval_batch_size: 8      # explicit to avoid OOM at eval (4096 tokens x 8 = safe)
  gradient_checkpointing: true       # required to fit in A100-40GB
  num_train_epochs: 5                # more expensive training; fewer epochs
  learning_rate: 3.0e-5
  warmup_ratio: 0.1
  group_by_length: true              # large gain here: avoids padding up to 4096
